stages: [verify, build, deploy]

variables:
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  NGINX_IMAGE: "$CI_REGISTRY_IMAGE/nginx"

# ── Шаблоны ──
.py-base:
  image: python:3.12-alpine
  before_script:
    - cd backend
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

.node-base:
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund

.dind-build:
  tags: [dind]
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--insecure-registry=158.160.211.36:5000"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_BUILDKIT: "1"
  before_script:
    - for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"

.ssh-deploy:
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - test -n "$DEPLOY_HOST" || { echo "Переменная DEPLOY_HOST не задана"; exit 1; }
    - echo "Подключаюсь к $DEPLOY_HOST порт 22"
    - ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - export IMAGE_TAG="${IMAGE_TAG:-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}}"
    - export SSH_TARGET="$DEPLOY_USER@$DEPLOY_HOST"

.release-manual:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never

# ── verify ──
lint:python:
  extends: .py-base
  stage: verify
  needs: []
  script:
    - ruff check .

lint:frontend:
  extends: .node-base
  stage: verify
  needs: []
  script:
    - npm run lint

test:unit:
  extends: .py-base
  stage: verify
  needs: []
  variables:
    POSTGRES__HOST: "127.0.0.1"
    POSTGRES__USER: "test"
    POSTGRES__PASSWORD: "test"
    DEBUG: "false"
  script:
    - pytest -q --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
    expire_in: 1 day

deps:python:
  image: python:3.12-alpine
  stage: verify
  needs: []
  script:
    - pip install --no-cache-dir -r backend/requirements.txt
    - pip freeze > pip.freeze
  artifacts:
    paths: [pip.freeze]
    expire_in: 7 days

deps:frontend:
  extends: .node-base
  stage: verify
  needs: []
  script:
    - npm ls --omit=dev --all > ../npm.ls
  artifacts:
    paths: [npm.ls]
    expire_in: 7 days

# ── build ──
build:backend:
  extends: .dind-build
  stage: build
  needs: [lint:python, test:unit]
  script:
    - docker build -t "$BACKEND_IMAGE:$TAG" ./backend
    - docker push "$BACKEND_IMAGE:$TAG"

build:frontend:
  extends: .dind-build
  stage: build
  needs: [lint:frontend]
  script:
    - printf '%s' "${TAG#v}" > release_version.txt
    - docker build --secret id=release_version,src=release_version.txt -t "$FRONTEND_IMAGE:$TAG" ./frontend
    - docker push "$FRONTEND_IMAGE:$TAG"

build:nginx:
  extends: .dind-build
  stage: build
  needs: []
  script:
    - docker build -t "$NGINX_IMAGE:$TAG" ./nginx
    - docker push "$NGINX_IMAGE:$TAG"

# ── deploy ──
deploy:
  extends: [.ssh-deploy, .release-manual]
  stage: deploy
  needs: [build:backend, build:frontend, build:nginx]
  variables:
    RUN_MIGRATIONS: "true"
  environment:
    name: production
    url: "https://$DEPLOY_HOST:8443"
  script:
    - printf 'IMAGE_PREFIX=%s\nIMAGE_TAG=%s\nDB_PASSWORD=%s\n' "$CI_REGISTRY_IMAGE" "$IMAGE_TAG" "$DB_PASSWORD" > .env.deploy
    - scp deploy/docker-compose.deploy.yml "$SSH_TARGET:/opt/devops-stack/docker-compose.yml"
    - scp .env.deploy "$SSH_TARGET:/opt/devops-stack/.env"
    - >
      ssh "$SSH_TARGET"
      "cd /opt/devops-stack && chmod 600 .env &&
      echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
      docker compose pull &&
      docker compose up -d --wait --wait-timeout 120 notes-db"
    - |
      if [ "$RUN_MIGRATIONS" = "true" ]; then
        ssh "$SSH_TARGET" "cd /opt/devops-stack && docker compose run --rm -T --no-deps notes-backend alembic upgrade head"
      else
        echo "Миграции пропущены (RUN_MIGRATIONS=$RUN_MIGRATIONS)"
      fi
    - ssh "$SSH_TARGET" "cd /opt/devops-stack && docker compose up -d --wait --wait-timeout 180 && docker image prune -f"

smoke:
  image:
    name: curlimages/curl:8.10.1
    entrypoint: [""]
  stage: deploy
  needs: [deploy]
  script:
    - curl -fsSk "https://$DEPLOY_HOST:8443/api/health"
    - curl -fsSk -o /dev/null "https://$DEPLOY_HOST:8443/api/notes/"
    - curl -fsSk -o /dev/null -w "HTTP %{http_code}\n" "https://$DEPLOY_HOST:8443/"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

# ── 5.4 canary ──
canary:
  extends: [.ssh-deploy, .release-manual]
  stage: deploy
  needs: [build:backend]
  script:
    - scp deploy/docker-compose.canary.yml "$SSH_TARGET:/opt/devops-stack/"
    - >
      ssh "$SSH_TARGET"
      "cd /opt/devops-stack &&
      echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
      CANARY_TAG='$IMAGE_TAG' docker compose -f docker-compose.canary.yml up -d --wait --wait-timeout 120"
    - |
      OK=0
      for i in $(seq 1 100); do
        curl -fs "http://$DEPLOY_HOST:8444/api/health" >/dev/null && OK=$((OK+1)) || true
      done
      echo "canary OK: $OK/100"
      test "$OK" -ge 99

promote:
  extends: [.ssh-deploy, .release-manual]
  stage: deploy
  needs: [canary, build:frontend, build:nginx]
  script:
    - >
      ssh "$SSH_TARGET"
      "cd /opt/devops-stack &&
      sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' .env &&
      echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
      docker compose pull && docker compose up -d --wait --wait-timeout 180 &&
      docker compose -f docker-compose.canary.yml rm -sf notes-backend-canary"

# ── 5.5 blue/green ──
deploy:bluegreen:
  extends: [.ssh-deploy, .release-manual]
  stage: deploy
  needs: [build:backend, build:frontend, build:nginx]
  script:
    - scp deploy/docker-compose.deploy.yml "$SSH_TARGET:/opt/devops-stack/docker-compose.bg.yml"
    - scp deploy/bluegreen.sh "$SSH_TARGET:/opt/devops-stack/"
    - >
      ssh "$SSH_TARGET"
      "cd /opt/devops-stack &&
      echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
      IMAGE_TAG='$IMAGE_TAG' sh bluegreen.sh"