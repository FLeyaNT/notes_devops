services:
  nginx:
    ports: !override
      - "8080:8080"
    volumes:
      - ./nginx/conf.d/debug.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  notes-backend:
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
    volumes:
      - ./backend/app:/app/app
    restart: "no"