services:
  notes-db:
    image: postgres:16
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: notes_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  notes-backend:
    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG}
    depends_on:
      notes-db:
        condition: service_healthy
    environment:
      POSTGRES__HOST: notes-db
      POSTGRES__USER: notes
      POSTGRES__PASSWORD: ${DB_PASSWORD}
      DEBUG: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  notes-frontend:
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    depends_on: [notes-backend]
    restart: unless-stopped

  nginx:
    image: ${IMAGE_PREFIX}/nginx:${IMAGE_TAG}
    depends_on:
      notes-backend:
        condition: service_healthy
      notes-frontend:
        condition: service_started
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped

volumes:
  db_data: